name: .NET Build & Test

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore OAuthority.slnx

      - name: Build
        run: dotnet build OAuthority.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test OAuthority.slnx --no-build --configuration Release --verbosity normal
